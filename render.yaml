# ============================================================================
# Celebrai — deploy gratuito no Render
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # API — Fastify + Prisma
  # --------------------------------------------------------------------------
  - type: web
    name: celebrai-api
    runtime: node
    region: oregon
    plan: free

    buildCommand: npm install && npm run db:generate --workspace @celebrai/api && npm run build --workspace @celebrai/api
    startCommand: npm run start --workspace @celebrai/api

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_PROVIDER
        value: postgresql

      - key: DATABASE_URL
        sync: false

      - key: JWT_ACCESS_SECRET
        sync: false

      - key: JWT_REFRESH_SECRET
        sync: false

      - key: INVITATION_TOKEN_SECRET
        sync: false

      - key: SEED_SUPER_ADMIN_EMAIL
        value: super@celebrai.app

      - key: SEED_SUPER_ADMIN_PASSWORD
        sync: false

      - key: MAIL_DRIVER
        value: disabled

      - key: WHATSAPP_DRIVER
        value: disabled

      - key: APP_URL
        value: https://celebrai-web.onrender.com

      - key: API_URL
        value: https://celebrai-api.onrender.com

      - key: CORS_ORIGINS
        value: https://celebrai-web.onrender.com


  # --------------------------------------------------------------------------
  # Frontend — React + Vite
  # --------------------------------------------------------------------------
  - type: web
    name: celebrai-web
    runtime: static
    plan: free

    buildCommand: npm install && npm run build --workspace @celebrai/web
    staticPublishPath: packages/web/dist

    envVars:
      - key: VITE_API_URL
        value: https://celebrai-api.onrender.com